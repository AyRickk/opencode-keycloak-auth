name: Release

# On every version tag, build the plugin and attach a ready-to-use artifact to
# the GitHub Release — no local `npm install && npm run build` needed by users.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test

      - name: Build plugin
        run: npm run build

      - name: Assemble release artifacts
        run: |
          # (1) Self-contained ESM bundle — drop straight into
          #     ~/.config/opencode/plugins/ (OpenCode auto-loads it). Zero runtime deps.
          cp dist/index.js opencode-keycloak-auth.js
          # (2) Vendored tarball (dist + README + package.json) for `npm install ./*.tgz`.
          npm pack

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Idempotent on workflow re-runs: skip if this version is already on npm.
          if npm view "opencode-keycloak-auth@${VERSION}" version >/dev/null 2>&1; then
            echo "opencode-keycloak-auth@${VERSION} already published — skipping."
          else
            npm publish opencode-keycloak-auth-${VERSION}.tgz --access public
          fi

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Grab the body of the "## [<version>]" section (up to the next "## [").
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md | awk 'NF { started = 1 } started' > RELEASE_NOTES.md
          if [ -s RELEASE_NOTES.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
            echo "Release notes for $VERSION:"; cat RELEASE_NOTES.md
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CHANGELOG section for $VERSION — falling back to auto-generated notes."
          fi

      - name: Create or update the release with the built plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAVE_NOTES: ${{ steps.notes.outputs.have_notes }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=(opencode-keycloak-auth.js opencode-keycloak-auth-*.tgz)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            # Keep the description in sync with the CHANGELOG on re-runs.
            if [ "$HAVE_NOTES" = "true" ]; then
              gh release edit "$TAG" --notes-file RELEASE_NOTES.md
            fi
          elif [ "$HAVE_NOTES" = "true" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md "${ASSETS[@]}"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes "${ASSETS[@]}"
          fi
